# Optional local infrastructure. Not started or validated during delivery.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: domino
      POSTGRES_USER: domino_migration_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - domino_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domino_migration_owner -d domino"]
      interval: 10s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:?Set a local Redis password}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - domino_redis:/data
volumes:
  domino_postgres:
  domino_redis:
