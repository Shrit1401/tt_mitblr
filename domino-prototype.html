<title>DOMINO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root{
    --bg:#FBFAF7; --fg:#141414; --muted:#6F6E68; --line:#E7E5DF; --soft:#F2F0EA; --card:#FFFFFF;
    --accent:#5B3DF5; --accent-soft:#EEEAFF;
    --red:#E5484D; --red-soft:#FDE8E8; --amber:#E9A23B; --amber-soft:#FDF1DC; --green:#2F9E63; --green-soft:#E3F5EA;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-inline:20px;padding-block:0 60px}
  h1,h2{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.03em;margin:0;text-wrap:balance}
  h1{font-size:clamp(30px,4.6vw,46px);font-weight:800;line-height:1.05}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  *:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
  .wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

  .top{display:flex;align-items:center;justify-content:space-between;height:64px;border-bottom:1px solid var(--line);margin-inline:-20px;padding-inline:20px;position:sticky;top:0;background:rgba(251,250,247,.9);backdrop-filter:blur(8px);z-index:10}
  .brand{font-family:"Inter Tight";font-weight:800;letter-spacing:-.02em;font-size:18px;display:flex;align-items:center;gap:10px}
  .brand i{width:22px;height:22px;border-radius:6px;background:var(--fg);display:inline-block}
  .steps{display:flex;gap:6px;align-items:center}
  .steps button{width:34px;height:6px;border-radius:999px;background:var(--line);transition:background .2s,width .2s}
  .steps button[aria-current=true]{background:var(--fg);width:46px}
  .steps button.done{background:var(--accent)}
  .stepnum{font-size:13px;color:var(--muted)}

  .hero{display:flex;flex-direction:column;gap:10px;padding-top:36px;max-width:720px}
  .hero p{margin:0;font-size:18px;color:var(--muted);max-width:60ch}

  .stage-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 22px 14px;overflow-x:auto}
  .stage{position:relative;min-width:700px;aspect-ratio:900/380;width:100%}
  .stage svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .lk{stroke:#C9C6BD;stroke-width:2;fill:none;stroke-linecap:round}
  .lk.q{stroke:var(--amber);stroke-dasharray:3 7}
  .lk.flow{stroke:var(--amber);stroke-width:3}
  .coin{fill:#F7C948;stroke:#C98A00;stroke-width:1.2}
  .q-bg{fill:#fff;stroke:var(--amber);stroke-width:1.5}
  .q-t{fill:var(--amber);font:800 13px "Inter Tight",sans-serif}
  .person{position:absolute;transform:translate(-50%,-50%);width:130px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:transform .2s}
  .person:hover{transform:translate(-50%,-50%) scale(1.04)}
  .person .avw{position:relative}
  .person .av{width:76px;height:76px;border-radius:50%;border:3px solid var(--line);background:#fff;overflow:hidden;display:block;transition:border-color .3s,box-shadow .3s}
  .person .av svg{width:100%;height:100%;display:block}
  .person.worried .av{border-color:var(--amber);box-shadow:0 0 0 5px var(--amber-soft)}
  .person.sad .av{border-color:var(--red);box-shadow:0 0 0 5px var(--red-soft)}
  .person.helped .av{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
  .person.ok .av{border-color:var(--green)}
  .person.picked .av{outline:3px solid var(--accent);outline-offset:3px}
  .person .nm{font-weight:600;font-size:15px;line-height:1.1}
  .person .jb{font-size:12.5px;color:var(--muted);line-height:1.1}
  .person .tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;line-height:1.5;background:var(--soft);color:var(--muted)}
  .person.sad .tag{background:var(--red);color:#fff}.person.worried .tag{background:var(--amber);color:#fff}.person.helped .tag{background:var(--accent);color:#fff}.person.ok .tag{background:var(--green-soft);color:var(--green)}
  .person .coins{position:absolute;top:-10px;right:-6px;display:flex;padding-left:8px}
  .person .coins i{width:22px;height:22px;border-radius:50%;background:#F7C948;border:2px solid #C98A00;display:inline-block;margin-left:-8px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .ripple{position:absolute;width:76px;height:76px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--red);pointer-events:none;opacity:0}
  @media (prefers-reduced-motion:no-preference){
    .ripple{animation:ripple 1.8s ease-out infinite}
    .person.sad .av{animation:shake .5s ease-in-out 1}
    .person.helped .av{animation:pop .5s cubic-bezier(.2,1.6,.4,1) 1}
    .line-in{animation:rise .35s ease-out both}
  }
  @keyframes ripple{0%{transform:translate(-50%,-50%) scale(.95);opacity:.7}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
  @keyframes shake{0%,100%{transform:none}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
  @keyframes pop{0%{transform:scale(.85)}100%{transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .stage-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line);margin-top:8px;font-size:13.5px;color:var(--muted)}
  .legend{display:flex;gap:14px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .weekpill{font-weight:600;color:var(--fg);background:var(--soft);padding:3px 10px;border-radius:999px}

  .panel{display:flex;flex-direction:column;gap:18px}
  .choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  @media (max-width:640px){.choices{grid-template-columns:1fr}}
  .choice{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px;text-align:left;transition:border-color .15s}
  .choice:hover{border-color:#BDB9AE}
  .choice[aria-checked=true]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
  .choice .em{font-size:26px}
  .choice b{font-size:16px;font-family:"Inter Tight";letter-spacing:-.01em}
  .choice span{font-size:14px;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:12px;font-weight:600;font-size:15px;transition:transform .1s,background .15s,opacity .15s}
  .btn:active{transform:translateY(1px)}
  .btn-dark{background:var(--fg);color:#fff}.btn-dark:hover{background:#2a2a2a}
  .btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:#4B2FD6}
  .btn-ghost{background:transparent;color:var(--muted)}.btn-ghost:hover{color:var(--fg);background:var(--soft)}
  .btn-line{border:1.5px solid var(--line);background:#fff}.btn-line:hover{border-color:#BDB9AE}
  .btn[disabled]{opacity:.4;pointer-events:none}
  .btn-sm{height:38px;padding:0 14px;font-size:14px;border-radius:10px}
  .nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:8px}
  .story{display:flex;flex-direction:column;gap:8px}
  .line-in{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:15px}
  .line-in .mini{width:36px;height:36px;border-radius:50%;flex:none;border:2px solid var(--line);overflow:hidden;background:#fff}
  .line-in .mini svg{width:100%;height:100%;display:block}
  .line-in.sad{border-color:#F3C1C3}.line-in.worried{border-color:#F6DDB1}.line-in.helped{border-color:#CFC5FB}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:640px){.two{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px}
  .card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .card.dim{opacity:.45}
  .card h3{margin:0;font-family:"Inter Tight";font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card p{margin:0;color:var(--muted);font-size:14.5px}
  .pct{font-size:13px;font-weight:600;background:var(--soft);padding:2px 9px;border-radius:999px;color:var(--fg)}
  .big{font-family:"Inter Tight";font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
  .kv b{color:var(--fg);font-weight:600;text-align:right}
  .callout{background:var(--card);border:1.5px solid var(--fg);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
  .callout.accent{border-color:var(--accent);background:var(--accent-soft)}
  .callout h3{margin:0;font-family:"Inter Tight";font-size:22px;letter-spacing:-.02em}
  .callout p{margin:0;font-size:15px;color:#3b3b38}
  .note{font-size:14.5px;color:var(--muted)}
  .note b{color:var(--fg);font-weight:600}
  .coinbank{display:flex;align-items:center;gap:8px;font-weight:600}
  .coinbank i{width:26px;height:26px;border-radius:50%;background:#F7C948;border:2px solid #C98A00;display:inline-block}
  .coinbank i.used{background:var(--soft);border-color:var(--line)}
  .toggle{display:flex;align-items:center;gap:12px;font-size:15px}
  .sw{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
  .sw[aria-checked=true]{background:var(--accent)}.sw[aria-checked=true]::after{transform:translateX(18px)}
  .seg{display:inline-flex;background:var(--soft);padding:4px;border-radius:12px;gap:2px}
  .seg button{padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
  .seg button[aria-pressed=true]{background:#fff;color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:var(--line)}
  input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:var(--fg);border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--fg);border:3px solid #fff}
  .slider{display:flex;flex-direction:column;gap:4px}
  .slider .l{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
  .slider .l b{color:var(--fg)}
  .rules{display:flex;flex-direction:column}
  .rules div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .rules div:last-child{border-bottom:0}
  .rules div.best{color:var(--accent);font-weight:600}
  .sim{font-size:12.5px;color:var(--muted);text-align:center}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  [hidden]{display:none!important}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><i></i> DOMINO</div>
    <div class="steps" id="steps"></div>
    <div class="stepnum" id="stepnum"></div>
  </header>

  <section class="hero"><h1 id="h1"></h1><p id="lede"></p></section>

  <section class="stage-card">
    <div class="stage" id="stage"><svg class="lines" id="lines" viewBox="0 0 900 380" preserveAspectRatio="none"></svg><div id="people"></div></div>
    <div class="stage-foot">
      <div class="legend"><span><i class="dot" style="background:var(--green)"></i> Fine</span><span><i class="dot" style="background:var(--amber)"></i> Short of money</span><span><i class="dot" style="background:var(--red)"></i> Missed a loan payment</span><span><i class="dot" style="background:var(--accent)"></i> Got help</span><span><i class="dot" style="background:#F7C948;border:1.5px solid #C98A00"></i> A friend paying for a friend</span></div>
      <span class="weekpill" id="weekpill">Week 0</span>
    </div>
  </section>

  <section class="panel" id="panel"></section>

  <nav class="nav"><button class="btn btn-ghost" id="back">← Back</button><button class="btn btn-dark" id="next">Next →</button></nav>
  <p class="sim">Everything here is a simulation with made-up families. No real data.</p>
</div>

<script>
/* ---------- the group ---------- */
const CUR='₹';
const B=[
 {name:'Meena',job:'Sells milk',inc:4200,ess:2400,inst:900,cash:3200,x:90,y:110,look:{skin:'#B5763C',hair:'#3A2416',style:'long',shirt:'#8B5CF6'}},
 {name:'Priya',job:'Tailor',inc:2400,ess:1900,inst:700,cash:1500,x:270,y:110,look:{skin:'#E0AC69',hair:'#2B1B12',style:'bun',shirt:'#EC4899'}},
 {name:'Ravi',job:'Sells vegetables',inc:3200,ess:2000,inst:800,cash:1500,x:450,y:110,look:{skin:'#C68642',hair:'#1F1410',style:'short',shirt:'#3B82F6'}},
 {name:'Arjun',job:'Fixes bicycles',inc:3000,ess:2100,inst:700,cash:1800,x:630,y:110,look:{skin:'#A86B3C',hair:'#1F1410',style:'cap',shirt:'#22C55E'}},
 {name:'Suresh',job:'Drives a rickshaw',inc:3800,ess:2500,inst:900,cash:2200,x:810,y:110,look:{skin:'#C68642',hair:'#2B1B12',style:'beard',shirt:'#EAB308'}},
 {name:'Lakshmi',job:'Sells snacks',inc:2600,ess:1900,inst:600,cash:1100,x:270,y:290,look:{skin:'#D9A066',hair:'#1F1410',style:'bun',shirt:'#F97316'}},
 {name:'Sunita',job:'Sells flowers',inc:2200,ess:1700,inst:500,cash:800,x:450,y:290,look:{skin:'#E0AC69',hair:'#2B1B12',style:'ponytail',shirt:'#F43F5E'}},
];
const N=B.length;
const EDGES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6]];
const GUAR=new Array(N).fill(null); EDGES.forEach(([g,b])=>GUAR[b]=g);
const CLUSTER=[1,2,5,6];
const TARGET=2, UNC=[1,2];
const OBS=4, TOTAL=8, HARM_MISS=10, HARM_BELOW=3, UNIT=1000, COINS=4;
const fmt=n=>CUR+Math.round(n).toLocaleString('en-IN');
const f1=n=>(Math.round(n*10)/10).toLocaleString('en-IN');

/* ---------- characters ---------- */
function avatar(i,mood){
  const L=B[i].look, s=L.skin,h=L.hair,sh=L.shirt,d='#1a1a1a'; let back='',front='';
  const cap=`<path d="M19 27c0-9 5-14 13-14s13 5 13 14c-2-5-6-7-13-7s-11 2-13 7z" fill="${h}"/>`;
  switch(L.style){
    case 'short': front=cap; break;
    case 'bun': front=cap+`<circle cx="32" cy="13" r="5" fill="${h}"/>`; break;
    case 'long': back=`<path d="M18 30c0-11 6-17 14-17s14 6 14 17v14H18z" fill="${h}"/>`; front=cap; break;
    case 'ponytail': back=`<path d="M40 22c6 2 8 10 6 20-3-2-5-8-6-20z" fill="${h}"/>`; front=cap; break;
    case 'cap': front=`<path d="M18 26c0-9 6-14 14-14s14 5 14 14z" fill="${sh}"/><rect x="16" y="24" width="32" height="4" rx="2" fill="${sh}"/>`; break;
    case 'beard': front=cap+`<path d="M21 33c1 8 5 12 11 12s10-4 11-12c-2 4-5 5-11 5s-9-1-11-5z" fill="${h}"/>`; break;
  }
  let mouth,brows='',extra='';
  if(mood==='sad'){mouth=`<path d="M26 38q6-5 12 0" stroke="${d}" stroke-width="2" fill="none" stroke-linecap="round"/>`;brows=`<path d="M24 22l6 2M40 22l-6 2" stroke="${d}" stroke-width="1.8" stroke-linecap="round"/>`;extra=`<path d="M39 30c2 3 2 5 0 5s-2-2 0-5z" fill="#7DD3FC"/>`;}
  else if(mood==='worried'){mouth=`<path d="M27 36q2.5-2 5 0t5 0" stroke="${d}" stroke-width="2" fill="none" stroke-linecap="round"/>`;brows=`<path d="M24 23l6 1M40 23l-6 1" stroke="${d}" stroke-width="1.8" stroke-linecap="round"/>`;extra=`<circle cx="42" cy="21" r="1.6" fill="#7DD3FC"/>`;}
  else if(mood==='helped'){mouth=`<path d="M25 33q7 8 14 0" stroke="${d}" stroke-width="2" fill="${d}" stroke-linecap="round"/>`;brows=`<path d="M24 22l6-1M40 22l-6-1" stroke="${d}" stroke-width="1.8" stroke-linecap="round"/>`;extra=`<circle cx="24" cy="32" r="2.2" fill="#FB7185" opacity=".5"/><circle cx="40" cy="32" r="2.2" fill="#FB7185" opacity=".5"/>`;}
  else {mouth=`<path d="M26 34q6 5 12 0" stroke="${d}" stroke-width="2" fill="none" stroke-linecap="round"/>`;brows=`<path d="M24 22.5l6-.5M40 22.5l-6-.5" stroke="${d}" stroke-width="1.6" stroke-linecap="round"/>`;}
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" fill="${sh}" opacity=".14"/>${back}<path d="M10 64c0-12 8-18 22-18s22 6 22 18z" fill="${sh}"/><path d="M27 44l5 6 5-6z" fill="#fff" opacity=".85"/><rect x="28" y="38" width="8" height="8" fill="${s}"/><circle cx="32" cy="28" r="13" fill="${s}"/>${front}<circle cx="27.5" cy="27.5" r="1.7" fill="${d}"/><circle cx="36.5" cy="27.5" r="1.7" fill="${d}"/>${brows}${mouth}${extra}</svg>`;
}

/* ---------- state ---------- */
const S={step:1,shock:'delay',moreWeeks:2,severity:1,checked:false,alloc:{},defer:false,week:0,showing:'judge',playing:false,played5:false,holdMsg:'',recBefore:''};
let R=null;

/* ---------- simulation ---------- */
function world(kind){
  const endWeek=OBS+S.moreWeeks;
  if(kind==='A') return {type:'market',scope:CLUSTER,sev:S.severity,endWeek,cover:false,mods:{}};
  return {type:S.shock,scope:S.shock==='market'?CLUSTER:[TARGET],sev:S.severity,endWeek,cover:true,mods:{}};
}
function dueFor(i,w,plan){const b=B[i];if(plan&&plan.defer&&i===TARGET){if(w===5||w===6)return 0;if(w===7||w===8)return b.inst*2;}return b.inst;}
function simulate(wd,plan,init,from,to){
  const cash=init.slice(),snaps={},ev=[];let missed=0,below=0;const perMissed=Array(N).fill(0),perShort=Array(N).fill(0),perBelow=Array(N).fill(0);
  for(let w=from;w<=to;w++){
    const mset=new Set(),sset=new Set();
    for(let i=0;i<N;i++){const b=B[i];let inc=b.inc;const s=(wd.type!=='expense'&&wd.scope.includes(i)&&w<=wd.endWeek)?wd.sev:0;inc=Math.round(inc*(1-s)*(wd.mods[i]??1));
      if(b.inc-inc>0)ev.push({w,i,type:'shock',amt:b.inc-inc});cash[i]+=inc;
      if(wd.type==='expense'&&w===1&&i===wd.scope[0]){const e=Math.round(2500*wd.sev);cash[i]-=e;ev.push({w,i,type:'expense',amt:e});}
      if(plan&&w===OBS+1&&plan.alloc[i]){cash[i]+=plan.alloc[i];ev.push({w,i,type:'support',amt:plan.alloc[i]});}
      if(cash[i]<b.ess){ev.push({w,i,type:'cut',amt:b.ess-cash[i]});cash[i]=0;}else cash[i]-=b.ess;}
    const short=Array(N).fill(0);
    for(let i=0;i<N;i++){const due=dueFor(i,w,plan);const pay=Math.min(cash[i],due);cash[i]-=pay;short[i]=due-pay;}
    for(let i=0;i<N;i++){if(short[i]<=0)continue;const g=GUAR[i];const unc=(g===UNC[0]&&i===UNC[1]);
      if(g!==null&&(!unc||wd.cover)){const c=Math.min(cash[g],short[i]);if(c>0){cash[g]-=c;short[i]-=c;ev.push({w,i:g,to:i,type:'guarantee',amt:c,hidden:unc});}}
      if(short[i]>0){missed++;perMissed[i]++;perShort[i]+=short[i];ev.push({w,i,type:'missed',amt:short[i]});mset.add(i);}}
    for(let i=0;i<N;i++)if(cash[i]<B[i].ess){below++;perBelow[i]++;sset.add(i);}
    snaps[w]={cash:cash.slice(),missed:[...mset],stressed:[...sset]};
  }
  return {snaps,ev,missed,below,perMissed,perShort,perBelow,end:cash,harm:HARM_MISS*missed+HARM_BELOW*below};
}
const INIT=B.map(b=>b.cash), NOPLAN={alloc:{},defer:false};
const planKey=p=>JSON.stringify([p.alloc,p.defer]), cost=p=>Object.values(p.alloc).reduce((a,b)=>a+b,0);
const expected=(plan,belief,s4)=>belief.reduce((h,[w,p])=>h+p*simulate(w,plan,s4,OBS+1,TOTAL).harm,0);
function bestPlan(plans,belief,s4){let best=null,bh=Infinity;for(const p of plans){const h=expected(p,belief,s4);if(h<bh-1e-9){bh=h;best=p;}}return {plan:best,harm:bh};}
function enumeratePlans(){const plans=[];(function rec(idx,left,cur){if(idx===N){for(const d of [false,true]){const a={};cur.forEach((u,j)=>{if(u)a[j]=u*UNIT;});plans.push({alloc:a,defer:d});}return;}for(let u=0;u<=left;u++){cur[idx]=u;rec(idx+1,left-u,cur);}})(0,COINS,[]);return plans;}
const PLANS=enumeratePlans();
function compute(){
  const truth=world('truth'),HA=world('A'),HB=world('B');
  const hist=simulate(truth,null,INIT,1,OBS),s4=hist.end;
  const belief=S.checked?[[HB,1]]:[[HA,.5],[HB,.5]];
  const rec=bestPlan(PLANS,belief,s4);
  const hyp={A:{w:S.checked?0:.5,none:simulate(HA,NOPLAN,s4,OBS+1,TOTAL),best:bestPlan(PLANS,[[HA,1]],s4)},B:{w:S.checked?1:.5,none:simulate(HB,NOPLAN,s4,OBS+1,TOTAL),best:bestPlan(PLANS,[[HB,1]],s4)}};
  function voi(vs){let hedged=Infinity;for(const pl of PLANS){let h=0;for(const v of vs)h+=v.p*expected(pl,v.belief,s4);if(h<hedged)hedged=h;}let informed=0;const per=[];for(const v of vs){const b=bestPlan(PLANS,v.belief,s4);informed+=v.p*b.harm;per.push(b.plan);}return {voi:hedged-informed,changes:per.some(p=>planKey(p)!==planKey(per[0]))};}
  const withEnd=e=>belief.map(([w,p])=>[{...w,endWeek:e},p]), withMod=(i,m)=>belief.map(([w,p])=>[{...w,mods:{...w.mods,[i]:m}},p]);
  const facts=[
    S.checked?{id:'guar',q:"Did Priya pay Ravi's loan for him?",voi:0,changes:false,resolved:true}:{id:'guar',q:"Did Priya pay Ravi's loan for him?",...voi([{p:.5,belief:[[HA,1]]},{p:.5,belief:[[HB,1]]}])},
    {id:'dur',q:'Does the trouble stop now, or last until week 8?',...voi([{p:.5,belief:withEnd(OBS)},{p:.5,belief:withEnd(TOTAL)}])},
    {id:'meena',q:'Is Meena still earning well?',...voi([{p:.5,belief:withMod(0,1)},{p:.5,belief:withMod(0,.6)}])},
  ].sort((a,b)=>b.voi-a.voi);
  const noneAll=belief.map(([w,p])=>({p,r:simulate(w,NOPLAN,s4,OBS+1,TOTAL)}));
  let first=null,fw=99;for(const {r} of noneAll)for(const e of r.ev)if(e.type==='missed'&&(e.w<fw||(e.w===fw&&e.i<first))){fw=e.w;first=e.i;}
  const shortSum=Array(N).fill(0);noneAll.forEach(({p,r})=>r.perShort.forEach((v,i)=>shortSum[i]+=p*v));const largest=shortSum.indexOf(Math.max(...shortSum));
  const troubled=new Set();noneAll.forEach(({r})=>{r.perMissed.forEach((v,i)=>{if(v)troubled.add(i)});r.perBelow.forEach((v,i)=>{if(v)troubled.add(i)});});
  const eq={};[...troubled].forEach(i=>eq[i]=Math.round(COINS*UNIT/troubled.size));
  const judge={alloc:{...S.alloc},defer:S.defer};
  const score=plan=>{const rows=belief.map(([w,p])=>({p,r:simulate(w,plan,s4,OBS+1,TOTAL)}));return {plan,missed:rows.reduce((a,x)=>a+x.p*x.r.missed,0),below:rows.reduce((a,x)=>a+x.p*x.r.below,0),harm:rows.reduce((a,x)=>a+x.p*x.r.harm,0),cost:cost(plan)};};
  const bench=[{name:'Do nothing',...score(NOPLAN)},{name:'Help whoever missed first',...score(first===null?NOPLAN:{alloc:{[first]:COINS*UNIT},defer:false})},{name:'Help the biggest shortfall',...score(shortSum[largest]>0?{alloc:{[largest]:COINS*UNIT},defer:false}:NOPLAN)},{name:'Split it equally',...score({alloc:eq,defer:false})},{name:'DOMINO',rec:true,...score(rec.plan)},{name:'You',judge:true,...score(judge)}];
  R={HA,HB,hist,s4,belief,rec,hyp,facts,bench,judge};
}
function shownPlan(){return S.step<5?NOPLAN:S.showing==='rec'?R.rec.plan:R.judge;}
function run(){
  const fc=simulate(S.checked?R.HB:R.HA,shownPlan(),R.s4,OBS+1,TOTAL);
  const snaps={0:{cash:INIT.slice(),missed:[],stressed:[]},...R.hist.snaps,...fc.snaps};
  return {snaps,ev:[...R.hist.ev,...fc.ev],plan:shownPlan()};
}
const visible=e=>!e.hidden||S.checked;
function moodOf(rn,i,w){const s=rn.snaps[w];if(s.missed.includes(i))return 'sad';if(rn.ev.some(e=>e.type==='support'&&e.i===i&&e.w===w))return 'helped';if(s.cash[i]<B[i].ess)return 'worried';return 'ok';}
function describe(p){const parts=Object.entries(p.alloc).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([i,v])=>`${fmt(v)} to ${B[i].name}`);if(p.defer)parts.push("pause Ravi's loan");return parts.length?parts.join(', '):'no help';}

/* ---------- stage ---------- */
const $=id=>document.getElementById(id);
function renderStage(){
  const rn=run(), w=S.week, snap=rn.snaps[w];
  const flows=new Map(); rn.ev.filter(e=>e.type==='guarantee'&&e.w===w&&visible(e)).forEach(e=>flows.set(e.i+'-'+e.to,e.amt));
  const R0=44;
  $('lines').innerHTML=EDGES.map(([g,b])=>{const a=B[g],c=B[b];const dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d;
    const x1=a.x+ux*(R0+6),y1=a.y+uy*(R0+6),x2=c.x-ux*(R0+10),y2=c.y-uy*(R0+10);const path=`M${x1} ${y1}L${x2} ${y2}`;
    const unc=g===UNC[0]&&b===UNC[1]&&!S.checked&&S.step>=3&&w>0, amt=flows.get(g+'-'+b);
    return `<path class="lk${unc?' q':''}${amt?' flow':''}" d="${path}" marker-end="url(#${amt?'ah':'a'})"/>${amt?`<circle class="coin" r="7"><animateMotion dur="1.3s" repeatCount="indefinite" path="${path}"/></circle><circle class="coin" r="7"><animateMotion dur="1.3s" begin=".65s" repeatCount="indefinite" path="${path}"/></circle>`:''}${unc?`<circle class="q-bg" cx="${(x1+x2)/2}" cy="${(y1+y2)/2}" r="11"/><text class="q-t" x="${(x1+x2)/2}" y="${(y1+y2)/2+5}" text-anchor="middle">?</text>`:''}`;}).join('')
    +`<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C9C6BD"/></marker><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E9A23B"/></marker></defs>`;
  const shocked=new Set(rn.ev.filter(e=>(e.type==='shock'||e.type==='expense')&&e.w===w&&(S.shock==='market'||e.i===TARGET)).map(e=>e.i));
  $('people').innerHTML=B.map((b,i)=>{const mood=w===0?'ok':moodOf(rn,i,w);const cash=snap.cash[i];
    const tag=w===0?`saves ${fmt(cash)}`:{sad:"Couldn't pay",worried:'Short of money',helped:'Got help',ok:'Fine'}[mood];
    const coins=S.step===5?Math.round((S.alloc[i]||0)/UNIT):0;
    return `${shocked.has(i)?`<div class="ripple" style="left:${b.x/9}%;top:${b.y/3.8}%"></div>`:''}<button class="person ${w===0?'':mood}${coins?' picked':''}" style="left:${b.x/9}%;top:${b.y/3.8}%" data-i="${i}" title="${b.name}: earns ${fmt(b.inc)} a week, needs ${fmt(b.ess)} for food and bills, pays ${fmt(b.inst)} on the loan. Savings now ${fmt(cash)}.">
      <span class="avw"><span class="av">${avatar(i,mood)}</span>${coins?`<span class="coins" data-take="${i}" title="Take a coin back">${'<i></i>'.repeat(coins)}</span>`:''}</span>
      <span class="nm">${b.name}</span><span class="jb">${b.job}</span><span class="tag">${tag}</span></button>`;}).join('');
  $('weekpill').textContent=w===0?'Before the trouble':`Week ${w} · ${w<=OBS?'what happened':'what could happen'}`;
}

/* ---------- steps ---------- */
const STEPS=[
 {t:'Seven families. Six promises.',l:'Each family runs a small business and pays a loan every week. An arrow means: “I promised to pay your loan if you can’t.” Hover anyone to see their money.'},
 {t:'Something goes wrong.',l:'Pick what happens to Ravi. Then watch how far it travels.'},
 {t:'Watch it spread.',l:'One family stumbles. Friends who promised to help start paying. Then they run short too.'},
 {t:'One question decides the answer.',l:'What we saw fits two different stories. Before spending any money, find out which one is true.'},
 {t:'You have 4 coins of ₹1,000.',l:'Tap a family to give them a coin. Tap the coins to take one back. Then see what happens.'},
 {t:'Your plan vs DOMINO’s plan.',l:'Same trouble, same money, same assumptions. Then push on the assumptions and see if the advice survives.'},
];
function renderSteps(){
  $('steps').innerHTML=STEPS.map((s,i)=>`<button data-s="${i+1}" aria-current="${S.step===i+1}" class="${i+1<S.step?'done':''}" aria-label="Step ${i+1}"></button>`).join('');
  $('stepnum').textContent=`Step ${S.step} of ${STEPS.length}`;
  $('h1').textContent=STEPS[S.step-1].t; $('lede').textContent=STEPS[S.step-1].l;
  $('back').style.visibility=S.step===1?'hidden':'visible';
  $('next').textContent=S.step===STEPS.length?'Start over':'Next →';
}
const SHOCKS={delay:{em:'⏳',t:'A customer pays late',d:'Ravi earns nothing for a few weeks.'},expense:{em:'🧾',t:'A surprise bill',d:'Ravi has to pay ₹2,500 at once.'},market:{em:'🏪',t:'The market closes',d:'Ravi, Priya, Lakshmi and Sunita all earn less.'}};
function storyLines(rn,w){
  const ev=rn.ev.filter(e=>e.w===w&&visible(e)); const out=[];
  const shocks=ev.filter(e=>e.type==='shock'||e.type==='expense');
  if(S.shock==='market'&&shocks.length) out.push({c:'worried',i:TARGET,t:`The market is closed. ${shocks.map(e=>B[e.i].name).join(', ')} earned much less.`});
  else shocks.filter(e=>e.i===TARGET).forEach(e=>out.push({c:'worried',i:e.i,t:e.type==='expense'?`Ravi paid a surprise bill of ${fmt(e.amt)}.`:`Ravi's customer did not pay. Ravi earned nothing this week.`}));
  ev.filter(e=>e.type==='support').forEach(e=>out.push({c:'helped',i:e.i,t:`${B[e.i].name} got ${fmt(e.amt)} of help.`}));
  if(rn.plan.defer&&w===OBS+1) out.push({c:'helped',i:TARGET,t:`Ravi's loan is paused for two weeks. He pays it back in weeks 7 and 8.`});
  ev.filter(e=>e.type==='guarantee').forEach(e=>out.push({c:'worried',i:e.i,t:`${B[e.i].name} paid ${fmt(e.amt)} of ${B[e.to].name}'s loan, as promised. Now ${B[e.i].name} has less.`}));
  ev.filter(e=>e.type==='missed').forEach(e=>out.push({c:'sad',i:e.i,t:`${B[e.i].name} could not pay the loan.`}));
  if(rn.ev.some(e=>e.w===w&&e.hidden&&!S.checked)) out.push({c:'',i:null,t:`Something happened between Priya and Ravi that is not in our records.`});
  if(!out.length) out.push({c:'',i:null,t:'A quiet week. Everyone paid.'});
  return out;
}
const lineHTML=(o,k)=>`<div class="line-in ${o.c}" style="animation-delay:${k*60}ms">${o.i!==null?`<span class="mini">${avatar(o.i,o.c||'ok')}</span>`:'<span class="mini" style="display:grid;place-items:center;color:var(--muted)">?</span>'}<span>${o.t}</span></div>`;
function renderPanel(){
  const P=$('panel'); const rn=run();
  if(S.step===1){
    P.innerHTML=`<div class="note">Meena promised to help Priya and Lakshmi. Priya promised to help Ravi. Ravi promised to help Arjun. And so on. Trouble can travel along these promises like falling dominoes.</div>`;
  }
  else if(S.step===2){
    P.innerHTML=`<div class="choices">${Object.entries(SHOCKS).map(([k,v])=>`<button class="choice" role="radio" aria-checked="${S.shock===k}" data-k="${k}"><span class="em">${v.em}</span><b>${v.t}</b><span>${v.d}</span></button>`).join('')}</div>`;
    P.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{S.shock=b.dataset.k;S.checked=false;S.alloc={};S.defer=false;S.played5=false;S.recBefore='';refresh();}));
  }
  else if(S.step===3){
    const lines=S.week===0?[{c:'',i:null,t:'Press play to see the first four weeks.'}]:storyLines(rn,S.week);
    P.innerHTML=`<div class="row"><button class="btn btn-accent" id="play">${S.playing?'Pause':S.week>=OBS?'Play again':'▶ Play'}</button><span class="note">${S.week===0?'':`Week ${S.week} of 4`}</span></div><div class="story">${lines.map(lineHTML).join('')}</div>`;
    $('play').addEventListener('click',()=>{if(S.playing){stop();return;}playTo(OBS,S.week>=OBS?0:S.week);});
  }
  else if(S.step===4){
    const H=R.hyp, top=R.facts[0], others=R.facts.slice(1);
    const hid=R.hist.ev.filter(e=>e.hidden);
    P.innerHTML=`<div class="two">
      <div class="card ${S.checked?'dim':''}"><h3>Story A <span class="pct">${Math.round(H.A.w*100)}%</span></h3><p><b>The market hurt everyone.</b> Sellers earned less. Priya never paid for Ravi.</p><div class="kv"><span>Best help if true</span><b>${describe(H.A.best.plan)}</b></div></div>
      <div class="card ${S.checked?'on':''}"><h3>Story B <span class="pct">${Math.round(H.B.w*100)}%</span></h3><p><b>Priya paid for Ravi.</b> Ravi's income failed. Priya kept his loan going until she ran dry.</p><div class="kv"><span>Best help if true</span><b>${describe(H.B.best.plan)}</b></div></div>
    </div>
    ${S.checked?`<div class="callout accent"><h3>Story B is true.</h3><p>The records show Priya paid ${fmt(hid.reduce((a,e)=>a+e.amt,0))} of Ravi's loan in week${hid.length>1?'s':''} ${hid.map(e=>e.w).join(' and ')}. So helping Ravi also protects Priya.</p><p>${S.recBefore&&S.recBefore!==describe(R.rec.plan)?`<b>The advice changed.</b> Before: ${S.recBefore}. Now: <b>${describe(R.rec.plan)}</b>.`:`DOMINO's advice: <b>${describe(R.rec.plan)}</b>.`}</p></div>`
    :`<div class="callout"><h3>Ask this first: ${top.q}</h3><p>Knowing the answer is worth about <b class="mono">${f1(top.voi)}</b> harm points, and it ${top.changes?'changes who should get the money':'does not change the plan'}. ${others.map(o=>`“${o.q}” is worth ${f1(o.voi)}`).join('. ')}.</p><div><button class="btn btn-accent" id="check">Check the records</button></div></div>`}`;
    const c=$('check'); if(c) c.addEventListener('click',()=>{S.recBefore=describe(R.rec.plan);S.checked=true;refresh();});
  }
  else if(S.step===5){
    const used=Math.round(cost(R.judge)/UNIT);
    const lines=S.played5&&S.week>OBS?storyLines(rn,S.week):[];
    P.innerHTML=`<div class="row" style="justify-content:space-between">
        <div class="coinbank">${Array.from({length:COINS},(_,k)=>`<i class="${k<used?'used':''}"></i>`).join('')}<span>${COINS-used} coin${COINS-used===1?'':'s'} left</span></div>
        <div class="row"><button class="btn btn-line btn-sm" id="useRec">Use DOMINO's plan</button><button class="btn btn-ghost btn-sm" id="clear">Clear</button></div></div>
      <label class="toggle"><button class="sw" id="defer" role="switch" aria-checked="${S.defer}"></button><span>Also let the bank pause Ravi's loan for two weeks. Free now, repaid in weeks 7 and 8.</span></label>
      <div class="row"><button class="btn btn-accent" id="go" ${used===0&&!S.defer?'disabled':''}>${S.playing?'Pause':S.played5?'Play again':'▶ See what happens'}</button><span class="note">${S.played5&&S.week>OBS?`Week ${S.week} of 8`:'Plays weeks 5 to 8 with your plan.'}</span></div>
      <div class="story">${lines.map(lineHTML).join('')}</div>`;
    $('useRec').addEventListener('click',()=>{S.alloc={...R.rec.plan.alloc};S.defer=R.rec.plan.defer;S.played5=false;S.week=OBS;refresh();});
    $('clear').addEventListener('click',()=>{S.alloc={};S.defer=false;S.played5=false;S.week=OBS;refresh();});
    $('defer').addEventListener('click',()=>{S.defer=!S.defer;S.played5=false;S.week=OBS;refresh();});
    $('go').addEventListener('click',()=>{if(S.playing){stop();return;}S.played5=true;S.showing='judge';playTo(TOTAL,OBS);});
  }
  else if(S.step===6){
    const j=R.bench.find(b=>b.judge),rec=R.bench.find(b=>b.rec);const empty=cost(R.judge)===0&&!R.judge.defer;const same=planKey(R.judge)===planKey(R.rec.plan);
    const best=Math.min(...R.bench.filter(b=>!(b.judge&&empty)).map(b=>b.harm));
    const card=(t,b,win)=>`<div class="card ${win?'on':''}"><h3>${t}${win?'<span class="pct" style="background:var(--accent-soft);color:var(--accent)">less harm</span>':''}</h3><div class="big">${f1(b.missed)}<span style="font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0"> missed payments</span></div><p>${describe(b.plan)}</p><div class="kv"><span>Weeks a family is short</span><b>${f1(b.below)}</b></div><div class="kv"><span>Harm score</span><b>${f1(b.harm)}</b></div></div>`;
    let why;
    if(empty) why='You gave no help yet. Go back one step to place your coins.';
    else if(same) why='<b>Your plan is the best one found.</b> DOMINO tried every way to place the coins and could not beat it.';
    else {const d=[];new Set([...Object.keys(R.judge.alloc),...Object.keys(R.rec.plan.alloc)]).forEach(k=>{const a=R.judge.alloc[k]||0,b=R.rec.plan.alloc[k]||0;if(a!==b)d.push(`${b>a?'more':'less'} to ${B[k].name}`);});if(R.judge.defer!==R.rec.plan.defer)d.push(R.rec.plan.defer?"pauses Ravi's loan":'skips the loan pause');const g=j.harm-rec.harm;why=`<b>Why:</b> DOMINO gives ${d.join(', ')}. That ${g>0?'avoids':'costs'} ${f1(Math.abs(g))} harm points${g>0?', because it stops the trouble before it reaches the friends who promised to pay':''}.`;}
    P.innerHTML=`<div class="row" style="justify-content:space-between"><span class="note">Show on the map at week 8:</span><div class="seg" id="showSeg"><button data-s="judge" aria-pressed="${S.showing==='judge'}">Your plan</button><button data-s="rec" aria-pressed="${S.showing==='rec'}">DOMINO's plan</button></div></div>
      <div class="two">${card('You',j,!empty&&j.harm<=rec.harm+1e-9)}${card('DOMINO',rec,empty||rec.harm<j.harm-1e-9)}</div>
      <div class="note">${why}</div>
      <div class="callout"><h3>Push on the assumptions.</h3>
        <div class="two"><div class="slider"><div class="l"><span>How long the trouble lasts</span><b>${S.moreWeeks} more week${S.moreWeeks===1?'':'s'}</b></div><input type="range" id="mw" min="0" max="4" step="1" value="${S.moreWeeks}"></div>
        <div class="slider"><div class="l"><span>How much income is lost</span><b>${Math.round(S.severity*100)}%</b></div><input type="range" id="sev" min="20" max="100" step="10" value="${Math.round(S.severity*100)}"></div></div>
        <p>${S.holdMsg||'Move a slider. Both plans are recomputed and the advice is checked again.'}</p></div>
      <div class="card"><h3>Simple rules, same money</h3><div class="rules">${R.bench.filter(b=>!(b.judge&&empty)).map(b=>`<div class="${Math.abs(b.harm-best)<1e-9?'best':''}"><span>${b.name}</span><span class="mono">${f1(b.harm)} harm</span></div>`).join('')}</div><p>Harm = 10 for every missed payment + 3 for every week a family is short of money, weeks 5 to 8.</p></div>`;
    $('showSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.showing=b.dataset.s;renderPanel();renderStage();});
    const stress=()=>{const before=describe(R.rec.plan);compute();const after=describe(R.rec.plan);S.holdMsg=before===after?`<b>The advice holds.</b> Still: ${after}.`:`<b>The advice changed.</b> It was “${before}”. Now it is “${after}”.`;renderPanel();renderStage();};
    $('mw').addEventListener('input',e=>{S.moreWeeks=+e.target.value;stress();});
    $('sev').addEventListener('input',e=>{S.severity=+e.target.value/100;stress();});
  }
}

/* ---------- playback ---------- */
let timer=null;
function stop(){S.playing=false;clearInterval(timer);timer=null;renderPanel();}
function playTo(end,from){S.playing=true;S.week=from;renderStage();renderPanel();timer=setInterval(()=>{if(S.week>=end){stop();return;}S.week++;renderStage();renderPanel();},1500);}
function refresh(){compute();renderSteps();renderStage();renderPanel();}
function go(step){
  stop(); S.step=Math.max(1,Math.min(STEPS.length,step));
  if(S.step<=2)S.week=0; else if(S.step===3)S.week=S.week>=OBS?OBS:0; else if(S.step===4)S.week=OBS; else if(S.step===5)S.week=S.played5?TOTAL:OBS; else S.week=TOTAL;
  if(S.step===6)S.showing='judge';
  window.scrollTo({top:0,behavior:'smooth'}); refresh();
}
$('next').addEventListener('click',()=>{if(S.step===STEPS.length){Object.assign(S,{shock:'delay',moreWeeks:2,severity:1,checked:false,alloc:{},defer:false,played5:false,holdMsg:'',recBefore:'',week:0});go(1);}else go(S.step+1);});
$('back').addEventListener('click',()=>go(S.step-1));
$('steps').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(+b.dataset.s);});
$('people').addEventListener('click',e=>{
  if(S.step!==5)return;
  const take=e.target.closest('[data-take]'); const p=e.target.closest('.person'); if(!p)return; const i=+p.dataset.i;
  if(take){S.alloc[i]=(S.alloc[i]||0)-UNIT;if(S.alloc[i]<=0)delete S.alloc[i];}
  else if(cost(R.judge)<COINS*UNIT){S.alloc[i]=(S.alloc[i]||0)+UNIT;}
  S.played5=false;S.week=OBS;refresh();
});
refresh();
</script>
